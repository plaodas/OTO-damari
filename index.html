<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#021a45" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OTO溜まり" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OTO溜まり</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html,
      body {
        height: 100dvh;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        background: #021a45;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      .volume-control {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 0;
        height: 44px;
        padding: 4px;
        overflow: hidden;
        color: #c8efff;
        background: rgb(0 20 50 / 42%);
        border: 1px solid rgb(150 225 255 / 12%);
        border-radius: 999px;
        opacity: 0.45;
        backdrop-filter: blur(8px);
        transition:
          gap 180ms ease,
          opacity 180ms ease;
      }

      .volume-control.is-open {
        gap: 6px;
        opacity: 1;
      }

      .volume-button {
        display: grid;
        flex: 0 0 36px;
        width: 36px;
        height: 36px;
        padding: 0;
        place-items: center;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
      }

      .volume-slider {
        width: 0;
        min-width: 0;
        height: 28px;
        margin: 0;
        accent-color: #75dfff;
        opacity: 0;
        pointer-events: none;
        transition:
          width 180ms ease,
          opacity 120ms ease;
      }

      .volume-control.is-open .volume-slider {
        width: 104px;
        margin-right: 6px;
        opacity: 1;
        pointer-events: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        .volume-control,
        .volume-slider {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="青い光の粒子"></canvas>
    <div class="volume-control" id="volume-control">
      <button
        class="volume-button"
        id="volume-button"
        type="button"
        aria-label="音量を調整"
        aria-expanded="false"
      >
        <span id="volume-icon" aria-hidden="true">🔊</span>
      </button>
      <input
        class="volume-slider"
        id="volume-slider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.85"
        aria-label="音量"
      />
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
